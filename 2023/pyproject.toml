[project]
name = "2023"
version = "0.1.0"
description = ""
authors = [{ name = "Tom VanAntwerp", email = "tom@tomvanantwerp.com" }]
requires-python = ">=3.11,<4"

[project.scripts]
day01 = "day01.main:main"
day02 = "day02.main:main"
day03 = "day03.main:main"
day04 = "day04.main:main"
day05 = "day05.main:main"
day06 = "day06.main:main"
day07 = "day07.main:main"
day08 = "day08.main:main"
day09 = "day09.main:main"
day10 = "day10.main:main"
day11 = "day11.main:main"

[dependency-groups]
dev = [
    "black>=23.11.0,<24",
    "pyright>=1.1.338,<2",
    "pylint>=3.0.2,<4",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
